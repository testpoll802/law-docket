<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Life Manager</title>
    
    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-page: #F6F8F6;
            --surface: #FFFFFF;
            --primary: #1F3024;         /* Deep Forest */
            --primary-light: #2D4031;
            --accent: #3B6946;          /* Eucalyptus Green */
            --accent-subtle: #EDF3EE;
            --text-main: #19211B;
            --text-muted: #657369;
            --border: #E2E8E3;
            --border-focus: #4A7856;
            
            /* Status & Priority Colors */
            --danger: #D9534F;
            --danger-bg: #FDF2F2;
            --warning: #D97706;
            --warning-bg: #FEF3C7;
            --info: #2563EB;
            --info-bg: #EFF6FF;
            --success: #34D399;

            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-sm: 0 2px 6px rgba(31, 48, 36, 0.03);
            --shadow-md: 0 4px 14px rgba(31, 48, 36, 0.06);
            --shadow-lg: 0 10px 25px rgba(31, 48, 36, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            margin: 0;
            padding-bottom: calc(env(safe-area-inset-bottom) + 85px);
            min-height: 100vh;
        }

        /* Top Header */
        header {
            background-color: var(--primary);
            color: #FFFFFF;
            padding: calc(env(safe-area-inset-top) + 14px) 18px 14px 18px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-title {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: white;
            padding: 8px;
            border-radius: 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
        }
        .icon-btn:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.22); }
        .icon-btn svg { width: 18px; height: 18px; fill: currentColor; }

        /* Status Indicator Chip */
        .status-chip {
            font-size: 0.73rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #E2E8E3;
            display: flex;
            align-items: center;
            gap: 6px;
            max-width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--success);
            flex-shrink: 0;
        }
        .status-dot.syncing { background-color: var(--warning); animation: pulse 1s infinite alternate; }
        .status-dot.offline { background-color: var(--danger); }

        @keyframes pulse { from { opacity: 0.4; } to { opacity: 1; } }

        main { padding: 16px; max-width: 640px; margin: 0 auto; }

        /* Global Search Bar */
        .search-container { position: relative; margin-bottom: 16px; }
        .search-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            font-size: 0.92rem;
            background: var(--surface);
            outline: none;
            color: var(--text-main);
            box-shadow: var(--shadow-sm);
            font-family: inherit;
            transition: all 0.2s ease;
        }
        .search-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(74, 120, 86, 0.15);
        }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }
        .search-dropdown {
            position: absolute; top: 100%; left: 0; right: 0;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
            z-index: 1000; max-height: 300px; overflow-y: auto; margin-top: 6px;
        }
        .search-result-item { padding: 12px 14px; border-bottom: 1px solid var(--bg-page); cursor: pointer; }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item:active { background-color: var(--accent-subtle); }
        .match-tag {
            display: inline-block; font-size: 0.68rem; background-color: var(--accent-subtle);
            color: var(--accent); padding: 3px 8px; border-radius: 6px; font-weight: 700; margin-bottom: 4px;
        }
        .match-tag.reminder-tag { background-color: var(--info-bg); color: var(--info); }
        .match-tag.aim-tag { background-color: var(--accent-subtle); color: var(--accent); }
        .match-tag.place-tag { background-color: #FCE7F3; color: #9D174D; }
        .match-tag.note-tag { background-color: var(--warning-bg); color: var(--warning); }
        .match-snippet { font-size: 0.84rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Cards & Forms */
        .card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 18px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .card.interactive {
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s;
        }
        .card.interactive:active {
            transform: scale(0.985);
            background-color: #FAFCFA;
        }

        /* Category Filter Pills */
        .category-pills {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 14px;
            -webkit-overflow-scrolling: touch;
        }
        .category-pills::-webkit-scrollbar { display: none; }

        .pill-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .pill-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 2px 6px rgba(59, 105, 70, 0.2);
        }

        /* Analytics Dashboard Card */
        .stats-dashboard {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-md);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 14px;
            text-align: center;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            padding: 12px 8px;
            border-radius: var(--radius-md);
        }

        .stat-val {
            font-size: 1.35rem;
            font-weight: 800;
            color: #FFFFFF;
        }

        .stat-lbl {
            font-size: 0.72rem;
            color: #D1DED5;
            font-weight: 600;
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .flex-between { display: flex; justify-content: space-between; align-items: center; }

        .badge {
            font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; display: inline-block;
            letter-spacing: 0.02em;
        }
        .badge-cat { background: var(--accent-subtle); color: var(--accent); }
        .badge-visited { background: #DCFCE7; color: #166534; }
        .badge-wishlist { background: #FEF3C7; color: #92400E; }
        
        .priority-high { background: var(--danger-bg); color: var(--danger); }
        .priority-medium { background: var(--warning-bg); color: var(--warning); }
        .priority-low { background: var(--accent-subtle); color: var(--accent); }

        label.field-label {
            font-weight: 700; font-size: 0.8rem; color: var(--primary-light);
            display: block; margin-bottom: 6px; margin-top: 12px;
            text-transform: uppercase; letter-spacing: 0.03em;
        }

        input[type="text"], input[type="tel"], input[type="datetime-local"], select, textarea {
            width: 100%; padding: 12px 14px; margin-bottom: 10px;
            border: 1px solid var(--border); border-radius: var(--radius-md);
            box-sizing: border-box; font-size: 0.92rem; background: #FAFCFA;
            color: var(--text-main); font-family: inherit; outline: none;
            transition: all 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--border-focus);
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(74, 120, 86, 0.12);
        }

        textarea { height: 100px; resize: vertical; }

        /* Buttons */
        .btn {
            padding: 10px 16px; border: none; border-radius: var(--radius-md);
            font-size: 0.85rem; font-weight: 700; color: white; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            font-family: inherit; transition: opacity 0.15s ease, transform 0.1s;
        }
        .btn-primary { background-color: var(--accent); }
        .btn-danger { background-color: var(--danger); }
        .btn-success { background-color: var(--accent); }
        .btn-secondary { background-color: #78867B; }
        .btn-small { padding: 6px 12px; font-size: 0.78rem; border-radius: var(--radius-sm); }
        .btn:active { opacity: 0.85; transform: scale(0.97); }

        /* Checklist Items */
        .aim-item, .reminder-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; background: var(--surface); border-radius: var(--radius-md);
            border: 1px solid var(--border); margin-bottom: 10px;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }
        .aim-item.done, .reminder-item.done {
            opacity: 0.65; background: #FAFBF9;
            box-shadow: none;
        }
        .aim-item.done .aim-title, .reminder-item.done .reminder-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }
        .checkbox-btn {
            width: 24px; height: 22px; border-radius: 50%;
            border: 2px solid var(--accent); display: flex;
            align-items: center; justify-content: center; cursor: pointer;
            margin-right: 14px; flex-shrink: 0; background: transparent;
            color: white; font-size: 0.75rem; font-weight: bold;
            transition: all 0.2s ease;
        }
        .checkbox-btn.checked {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* Calendar View */
        .cal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; background: var(--surface); padding: 14px; border-radius: var(--radius-md);
            border: 1px solid var(--border); box-shadow: var(--shadow-sm);
        }
        .cal-grid-wrapper {
            background: var(--surface); border-radius: var(--radius-lg); overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm); margin-bottom: 16px;
        }
        .cal-grid-header {
            display: grid; grid-template-columns: repeat(7, 1fr);
            background: var(--primary); color: white; text-align: center;
            font-weight: 700; font-size: 0.75rem; padding: 12px 0;
        }
        .cal-grid-body {
            display: grid; grid-template-columns: repeat(7, 1fr);
            background: var(--border); gap: 1px;
        }
        .cal-day {
            background: var(--surface); min-height: 68px; padding: 6px;
            box-sizing: border-box; display: flex; flex-direction: column; cursor: pointer;
            transition: background 0.15s;
        }
        .cal-day.other-month { background: #FAFBF9; opacity: 0.45; }
        .cal-day.today { background: var(--accent-subtle); }
        .cal-day.selected-day { border: 2px solid var(--accent); background: #FFFDF9; }
        .cal-day.today .day-number {
            background: var(--accent); color: white; border-radius: 50%;
            width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center;
        }
        .day-number { font-size: 0.75rem; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
        .day-events-dots { display: flex; gap: 3px; flex-wrap: wrap; margin-top: auto; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background-color: var(--accent); }
        .dot.done { background-color: #9CA3AF; }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 4px calc(env(safe-area-inset-bottom) + 8px) 4px;
            z-index: 999;
            box-shadow: 0 -4px 16px rgba(0,0,0,0.03);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 6px 4px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
            max-width: 72px;
        }

        .tab-btn svg {
            width: 19px;
            height: 19px;
            fill: currentColor;
            transition: transform 0.2s ease;
        }

        .tab-btn.active {
            color: var(--accent);
        }
        .tab-btn.active svg {
            transform: translateY(-1px);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div class="brand-title">
        🌿 Life Manager
    </div>
    
    <div class="header-actions">
        <div class="status-chip">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Synced</span>
        </div>
        <button class="icon-btn" onclick="openSyncSettings()" title="GitHub Sync Settings">
            <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path fill-rule="evenodd" d="M1.323 11.447C2.811 6.976 7.028 3.75 12.001 3.75c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113-1.487 4.471-5.705 7.697-10.677 7.697-4.97 0-9.186-3.223-10.675-7.69a1.762 1.762 0 010-1.113zM12 17a5 5 0 100-10 5 5 0 000 10z" clip-rule="evenodd"/></svg>
        </button>
        <button class="icon-btn" onclick="exportJSON()" title="Backup JSON">
            <svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2.25a.75.75 0 01.75.75v11.69l3.22-3.22a.75.75 0 111.06 1.06l-4.5 4.5a.75.75 0 01-1.06 0l-4.5-4.5a.75.75 0 111.06-1.06l3.22 3.22V3a.75.75 0 01.75-.75z" clip-rule="evenodd"/><path d="M3.75 16.5a.75.75 0 01.75.75v2.25c0 .414.336.75.75.75h13.5a.75.75 0 00.75-.75V17.25a.75.75 0 011.5 0v2.25A2.25 2.25 0 0118.75 21.75H5.25A2.25 2.25 0 013 19.5V17.25a.75.75 0 01.75-.75z"/></svg>
        </button>
    </div>
</header>

<main>
    <div class="search-container">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" class="search-input" id="global-search" 
               placeholder="Search aims, places, reminders, notes..." 
               oninput="handleGlobalSearch(this.value)">
        <div id="search-dropdown" class="search-dropdown hidden"></div>
    </div>

    <div id="app-content"></div>
</main>

<!-- Bottom Navigation Bar -->
<nav class="bottom-nav">
    <button class="tab-btn active" id="nav-aims" onclick="navigate('aims')">
        <svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm14.03-3.22a.75.75 0 00-1.06-1.06l-4.72 4.72-1.97-1.97a.75.75 0 10-1.06 1.06l2.5 2.5a.75.75 0 001.06 0l5.25-5.25z" clip-rule="evenodd"/></svg>
        Daily Aims
    </button>
    <button class="tab-btn" id="nav-places" onclick="navigate('places')">
        <svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M11.54 22.351l.07.04.028.016a.76.76 0 00.723 0l.028-.015.071-.041a16.975 16.975 0 001.144-.742 19.58 19.58 0 002.683-2.282c1.944-1.99 3.963-4.98 3.963-8.827a8.25 8.25 0 00-16.5 0c0 3.846 2.02 6.837 3.963 8.827a19.58 19.58 0 002.682 2.282 16.975 16.975 0 001.145.742zM12 13.5a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
        Places
    </button>
    <button class="tab-btn" id="nav-reminders" onclick="navigate('reminders')">
        <svg viewBox="0 0 24 24"><path d="M5.85 3.5a.75.75 0 00-1.117-1l-2 2.25a.75.75 0 101.117 1l2-2.25zM19.267 2.5a.75.75 0 00-1.117 1l2 2.25a.75.75 0 001.117-1l-2-2.25z"/><path fill-rule="evenodd" d="M12 2.25a7.25 7.25 0 00-7.25 7.25v3.447c0 1.054-.37 2.073-1.041 2.872A.75.75 0 004.28 17h15.44a.75.75 0 00.57-1.181 6.255 6.255 0 01-1.04-2.872V9.5A7.25 7.25 0 0012 2.25zM9.75 18a2.25 2.25 0 004.5 0h-4.5z" clip-rule="evenodd"/></svg>
        Reminders
    </button>
    <button class="tab-btn" id="nav-notes" onclick="navigate('notes')">
        <svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M5.625 1.5c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a.75.75 0 00-1.5 0v7.875H6V3h6.375a.75.75 0 000-1.5H5.625z" clip-rule="evenodd"/><path fill-rule="evenodd" d="M14.25 2.25a.75.75 0 01.75-.75h3.75c.414 0 .75.336.75.75v3.75a.75.75 0 01-1.5 0V4.56l-5.47 5.47a.75.75 0 01-1.06-1.06l5.47-5.47H15a.75.75 0 01-.75-.75z" clip-rule="evenodd"/></svg>
        Notes
    </button>
    <button class="tab-btn" id="nav-calendar" onclick="navigate('calendar')">
        <svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M6.75 2.25A.75.75 0 017.5 3v1.5h9V3a.75.75 0 011.5 0v1.5h.75dC20.037 4.5 21 5.463 21 6.643v11.607c0 1.18-.963 2.143-2.143 2.143H5.143A2.143 2.143 0 013 18.25V6.643C3 5.463 3.963 4.5 5.143 4.5h.857V3a.75.75 0 01.75-.75zM4.5 8.25v10a.643.643 0 00.643.643h13.714a.643.643 0 00.643-.643v-10H4.5z" clip-rule="evenodd"/></svg>
        Calendar
    </button>
</nav>

<script>
    let db = { aims: [], places: [], reminders: [], notes: [] };
    let currentCalDate = new Date();
    let selectedCalDateKey = new Date().toISOString().split('T')[0];
    let currentView = 'aims';
    let currentPlaceFilter = 'All';
    let isAddingAim = false;
    let isAddingPlace = false;
    let isAddingReminder = false;
    let isAddingNote = false;
    let showCompletedReminders = false;
    let fileSha = null;
    let debounceTimer = null;

    function getTodayKey() {
        return new Date().toISOString().split('T')[0];
    }

    // --- HELPER FUNCTIONS ---
    function getOrdinalNum(n) {
        return n + (["st","nd","rd"][((n+90)%100-10)%10] || "th");
    }

    function formatHeaderDateStr(dateKey) {
        const parts = dateKey.split('-');
        if (parts.length !== 3) return dateKey;
        const y = parseInt(parts[0]), m = parseInt(parts[1]) - 1, d = parseInt(parts[2]);
        const dateObj = new Date(y, m, d);
        if (isNaN(dateObj.getTime())) return dateKey;

        const todayStr = getTodayKey();
        const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
        const monthName = dateObj.toLocaleDateString('en-US', { month: 'short' });
        const ordinalDay = getOrdinalNum(d);

        let prefix = dateKey === todayStr ? 'Today — ' : '';
        return `${prefix}${ordinalDay} ${monthName} (${dayName}), ${y}`;
    }

    function formatDateTime(str) {
        if (!str) return '';
        const d = new Date(str);
        if (isNaN(d.getTime())) return str;
        return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) + 
               ' at ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: true });
    }

    function formatTimeOnly(str) {
        if (!str) return '';
        const d = new Date(str);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: true });
    }

    function renderStars(rating) {
        const score = parseInt(rating) || 0;
        let stars = '';
        for (let i = 1; i <= 5; i++) {
            stars += i <= score ? '★' : '☆';
        }
        return `<span style="color:#F59E0B; font-size:0.85rem; letter-spacing:1px;">${stars}</span>`;
    }

    // --- PRIVATE REPOSITORY SYNC ENGINE ---
    function getGHConfig() {
        return {
            user: localStorage.getItem('gh_user') || '',
            repo: localStorage.getItem('gh_private_repo') || 'law-docket-data',
            token: localStorage.getItem('gh_pat_token') || ''
        };
    }

    function setStatus(msg, state = 'synced') {
        const dot = document.getElementById('status-dot');
        const text = document.getElementById('status-text');
        
        dot.className = 'status-dot ' + (state === 'syncing' ? 'syncing' : (state === 'offline' ? 'offline' : ''));
        text.innerText = msg;
    }

    async function loadFromPrivateRepo() {
        const config = getGHConfig();
        if (!config.user || !config.token || !config.repo) {
            setStatus('Local Mode', 'offline');
            loadFromLocalStorage();
            return;
        }

        try {
            setStatus('Syncing...', 'syncing');
            const url = `https://api.github.com/repos/${config.user}/${config.repo}/contents/law_docket_data.json`;
            const res = await fetch(url, {
                headers: {
                    'Authorization': `token ${config.token}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });

            if (res.ok) {
                const data = await res.json();
                fileSha = data.sha;
                const decodedText = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
                db = JSON.parse(decodedText);
                sanitizeDB();
                localStorage.setItem('law_db_auto', JSON.stringify(db));
                setStatus('Synced', 'synced');
                navigate(currentView);
            } else if (res.status === 404) {
                setStatus('Initialized', 'synced');
                loadFromLocalStorage();
            } else {
                setStatus('Auth Error', 'offline');
                loadFromLocalStorage();
            }
        } catch (err) {
            console.error("Private repo load error:", err);
            setStatus('Offline Mode', 'offline');
            loadFromLocalStorage();
        }
    }

    async function syncToPrivateRepo() {
        const config = getGHConfig();
        if (!config.user || !config.token || !config.repo) {
            setStatus('Saved Locally', 'offline');
            return;
        }

        try {
            setStatus('Saving...', 'syncing');
            const jsonString = JSON.stringify(db, null, 2);
            const contentBase64 = btoa(unescape(encodeURIComponent(jsonString)));

            const url = `https://api.github.com/repos/${config.user}/${config.repo}/contents/law_docket_data.json`;
            const payload = {
                message: 'Update life manager data',
                content: contentBase64
            };
            if (fileSha) payload.sha = fileSha;

            const res = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${config.token}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                const resData = await res.json();
                fileSha = resData.content.sha;
                setStatus('Synced', 'synced');
            } else {
                setStatus('Sync Failed', 'offline');
            }
        } catch (err) {
            console.error("Private repo save error:", err);
            setStatus('Offline Error', 'offline');
        }
    }

    function autoSave() {
        localStorage.setItem('law_db_auto', JSON.stringify(db));
        setStatus('Saving...', 'syncing');
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            syncToPrivateRepo();
        }, 1200);
    }

    function sanitizeDB() {
        if (!db.aims) db.aims = [];
        if (!db.places) db.places = [];
        if (!db.reminders) db.reminders = [];
        if (!db.notes) db.notes = [];

        db.aims.forEach(a => {
            a.title = a.title || '';
            a.category = a.category || 'Habit';
            a.createdAt = a.createdAt || getTodayKey();
            a.history = a.history || {};
        });

        db.places.forEach(p => {
            p.name = p.name || '';
            p.location = p.location || '';
            p.category = p.category || 'Restaurants';
            p.notes = p.notes || '';
            p.rating = p.rating || '5';
            p.visited = !!p.visited;
        });

        db.reminders.forEach(r => {
            r.title = r.title || '';
            r.dueDate = r.dueDate || '';
            r.priority = r.priority || 'medium';
            r.category = r.category || 'General';
            r.status = r.status || 'pending';
            r.notes = r.notes || '';
        });

        db.notes.forEach(n => {
            n.title = n.title || '';
            n.category = n.category || 'General';
            n.content = n.content || '';
            n.updatedAt = n.updatedAt || new Date().toISOString();
        });
    }

    function loadFromLocalStorage() {
        const localData = localStorage.getItem('law_db_auto');
        if (localData) {
            try { db = JSON.parse(localData); } catch(e){}
        }
        sanitizeDB();
        navigate(currentView);
    }

    async function exportJSON() {
        try {
            const jsonStr = JSON.stringify(db, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const fileName = `life_manager_backup_${getTodayKey()}.json`;
            const file = new File([blob], fileName, { type: 'application/json' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        files: [file],
                        title: 'Life Manager Backup',
                        text: 'Life Manager JSON Data Backup'
                    });
                    return;
                } catch (shareErr) {
                    if (shareErr.name === 'AbortError') return;
                }
            }

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 2000);

        } catch (err) {
            alert('Backup error: ' + err.message);
        }
    }

    function handleGlobalSearch(query) {
        const dropdown = document.getElementById('search-dropdown');
        const term = query.trim().toLowerCase();

        if (!term) {
            dropdown.innerHTML = '';
            dropdown.classList.add('hidden');
            return;
        }

        let results = [];

        (db.aims || []).forEach(a => {
            if (a.title && a.title.toLowerCase().includes(term)) {
                results.push({ type: 'aim', tag: 'Daily Aim', snippet: a.title });
            }
        });

        (db.places || []).forEach(p => {
            if (p.name && p.name.toLowerCase().includes(term)) {
                results.push({ type: 'place', tag: 'Bangalore Place', snippet: `${p.name} (${p.location || 'BLR'})` });
            } else if (p.location && p.location.toLowerCase().includes(term)) {
                results.push({ type: 'place', tag: 'Location', snippet: `${p.name} - ${p.location}` });
            } else if (p.notes && p.notes.toLowerCase().includes(term)) {
                results.push({ type: 'place', tag: 'Place Review', snippet: `${p.name}: ${p.notes}` });
            }
        });

        (db.reminders || []).forEach(r => {
            if (r.title && r.title.toLowerCase().includes(term)) {
                results.push({ type: 'reminder', tag: 'Reminder', snippet: `${r.title} ${r.dueDate ? `(${formatDateTime(r.dueDate)})` : ''}` });
            } else if (r.notes && r.notes.toLowerCase().includes(term)) {
                results.push({ type: 'reminder', tag: 'Reminder Note', snippet: `${r.title}: ${r.notes}` });
            }
        });

        (db.notes || []).forEach(n => {
            if (n.title && n.title.toLowerCase().includes(term)) {
                results.push({ noteId: n.id, type: 'note', tag: 'Note Title', snippet: n.title });
            } else if (n.content && n.content.toLowerCase().includes(term)) {
                results.push({ noteId: n.id, type: 'note', tag: 'Note Content', snippet: n.content });
            }
        });

        if (results.length === 0) {
            dropdown.innerHTML = `<div style="padding:14px; color:var(--text-muted); font-size:0.85rem; text-align:center;">No matching items found</div>`;
        } else {
            dropdown.innerHTML = results.map(r => `
                <div class="search-result-item" onclick="handleSearchResultClick('${r.type}', '${r.noteId || ''}')">
                    <span class="match-tag ${r.type === 'reminder' ? 'reminder-tag' : (r.type === 'aim' ? 'aim-tag' : (r.type === 'place' ? 'place-tag' : 'note-tag'))}">${r.tag}</span>
                    <div class="match-snippet">${r.snippet}</div>
                </div>
            `).join('');
        }
        dropdown.classList.remove('hidden');
    }

    function handleSearchResultClick(type, noteId) {
        document.getElementById('global-search').value = '';
        document.getElementById('search-dropdown').classList.add('hidden');
        if (type === 'aim') {
            navigate('aims');
        } else if (type === 'place') {
            navigate('places');
        } else if (type === 'reminder') {

    // --- TAB 1: DAILY AIMS VIEW & ANALYTICS ---
    function calculateAimSuccess(aim) {
        const start = new Date(aim.createdAt || getTodayKey());
        const now = new Date();
        const diffDays = Math.max(1, Math.floor((now - start) / (1000 * 60 * 60 * 24)) + 1);
        
        const completedDays = Object.values(aim.history || {}).filter(Boolean).length;
        const rate = Math.min(100, Math.round((completedDays / diffDays) * 100));
        
        return { completedDays, totalDays: diffDays, rate };
    }

    function calculateOverallAimsStats() {
        if (!db.aims || db.aims.length === 0) {
            return { overallRate: 0, todayDone: 0, totalAims: 0 };
        }

        const todayKey = getTodayKey();
        let totalCompleted = 0;
        let totalDaysSum = 0;
        let todayDone = 0;

        db.aims.forEach(aim => {
            const stats = calculateAimSuccess(aim);
            totalCompleted += stats.completedDays;
            totalDaysSum += stats.totalDays;
            if (aim.history && aim.history[todayKey]) todayDone++;
        });

        const overallRate = totalDaysSum > 0 ? Math.round((totalCompleted / totalDaysSum) * 100) : 0;
        return { overallRate, todayDone, totalAims: db.aims.length };
    }

    // --- TAB 3: REMINDERS VIEW ---
    function renderRemindersView(container) {
        const pendingReminders = db.reminders.filter(r => r.status !== 'done');
        const doneReminders = db.reminders.filter(r => r.status === 'done');

        const priorityOrder = { high: 1, medium: 2, low: 3 };
        pendingReminders.sort((a, b) => {
            if (priorityOrder[a.priority] !== priorityOrder[b.priority]) {
                return priorityOrder[a.priority] - priorityOrder[b.priority];
            }
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;
            return a.dueDate.localeCompare(b.dueDate);
        });

        let html = `
            <div class="flex-between" style="margin-bottom: 14px;">
                <h2 style="margin:0; font-size:1.15rem; font-weight:800; letter-spacing:-0.01em;">Reminders (${pendingReminders.length})</h2>
                <button class="btn btn-primary btn-small" onclick="showAddReminderForm()">+ New Reminder</button>
            </div>
        `;

        if (isAddingReminder) {
            html += `
                <div class="card" style="background: var(--accent-subtle); margin-bottom: 16px;">
                    <h3 style="margin-top:0; font-size:1rem; font-weight:700; color:var(--primary);">Create Reminder</h3>
                    
                    <label class="field-label">Reminder Title *</label>
                    <input type="text" id="rem-title" placeholder="e.g., Pay utility bill, Doctor appointment">

                    <label class="field-label">Due Date & Time (Optional)</label>
                    <input type="datetime-local" id="rem-due">

                    <div style="display:flex; gap:10px;">
                        <div style="flex:1;">
                            <label class="field-label">Category</label>
                            <input type="text" id="rem-category" placeholder="Personal, Work...">
                        </div>
                        <div style="flex:1;">
                            <label class="field-label">Priority</label>
                            <select id="rem-priority">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                    </div>

                    <label class="field-label">Notes (Optional)</label>
                    <input type="text" id="rem-notes" placeholder="Additional details...">

                    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:10px;">
                        <button class="btn btn-success btn-small" onclick="saveNewReminder()">Save Reminder</button>
                        <button class="btn btn-secondary btn-small" onclick="cancelAddReminder()">Cancel</button>
                    </div>
                </div>
            `;
        }

        if (pendingReminders.length === 0 && !isAddingReminder) {
            html += `<p style="color:var(--text-muted); text-align:center; padding: 28px;">No active reminders. Tap "+ New Reminder" to set one.</p>`;
        } else {
            pendingReminders.forEach(r => {
                html += `
                    <div class="reminder-item">
                        <div style="display:flex; align-items:center; flex:1;">
                            <div class="checkbox-btn" onclick="toggleReminder('${r.id}')"></div>
                            <div style="flex:1; padding-right:10px;">
                                <div class="reminder-title" style="font-weight:700; font-size:0.95rem; color:var(--text-main);">${r.title}</div>
                                <div style="font-size:0.78rem; color:var(--text-muted); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                                    ${r.dueDate ? `<span>📅 ${formatDateTime(r.dueDate)}</span>` : ''}
                                    ${r.category ? `<span>🏷️ ${r.category}</span>` : ''}
                                    ${r.notes ? `<span>📝 ${r.notes}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span class="badge priority-${r.priority}">${r.priority.toUpperCase()}</span>
                            <button class="btn btn-danger btn-small" onclick="deleteReminder('${r.id}')">✕</button>
                        </div>
                    </div>
                `;
            });
        }

        if (doneReminders.length > 0) {
            html += `
                <div style="margin-top:20px; text-align:center;">
                    <button class="btn btn-secondary btn-small" onclick="toggleShowCompletedReminders()">
                        ${showCompletedReminders ? 'Hide Completed' : `Show Completed (${doneReminders.length})`}
                    </button>
                </div>
            `;

            if (showCompletedReminders) {
                html += `<div style="margin-top:12px;">`;
                doneReminders.forEach(r => {
                    html += `
                        <div class="reminder-item done">
                            <div style="display:flex; align-items:center; flex:1;">
                                <div class="checkbox-btn checked" onclick="toggleReminder('${r.id}')">✓</div>
                                <div style="flex:1; padding-right:10px;">
                                    <div class="reminder-title" style="font-weight:600; font-size:0.95rem;">${r.title}</div>
                                </div>
                            </div>
                            <button class="btn btn-danger btn-small" onclick="deleteReminder('${r.id}')">✕</button>
                        </div>
                    `;
                });
                html += `</div>`;
            }
        }

        container.innerHTML = html;
    }

    function showAddReminderForm() { isAddingReminder = true; renderRemindersView(document.getElementById('app-content')); }
    function cancelAddReminder() { isAddingReminder = false; renderRemindersView(document.getElementById('app-content')); }

    function saveNewReminder() {
        const title = document.getElementById('rem-title').value.trim();
        if (!title) return alert("Please enter a Reminder Title");

        const dueDate = document.getElementById('rem-due').value;
        const category = document.getElementById('rem-category').value.trim() || 'General';
        const priority = document.getElementById('rem-priority').value;
        const notes = document.getElementById('rem-notes').value.trim();

        db.reminders.push({
            id: 'r_' + Date.now(),
            title: title,
            dueDate: dueDate,
            category: category,
            priority: priority,
            notes: notes,
            status: 'pending'
        });

        isAddingReminder = false;
        autoSave();
        renderRemindersView(document.getElementById('app-content'));
    }

    function toggleReminder(id) {
        const r = db.reminders.find(x => x.id === id);
        if (r) {
            r.status = r.status === 'done' ? 'pending' : 'done';
            autoSave();
            renderRemindersView(document.getElementById('app-content'));
        }
    }

    function deleteReminder(id) {
        db.reminders = db.reminders.filter(x => x.id !== id);
        autoSave();
        renderRemindersView(document.getElementById('app-content'));
    }

    function toggleShowCompletedReminders() {
        showCompletedReminders = !showCompletedReminders;
        renderRemindersView(document.getElementById('app-content'));
    }

    // --- TAB 4: NOTES VIEW ---
    function renderNotesView(container) {
        let html = `
            <div class="flex-between" style="margin-bottom: 14px;">
                <h2 style="margin:0; font-size:1.15rem; font-weight:800; letter-spacing:-0.01em;">Notes (${db.notes.length})</h2>
                <button class="btn btn-primary btn-small" onclick="showAddNoteForm()">+ New Note</button>
            </div>
        `;

        if (isAddingNote) {
            html += `
                <div class="card" style="background: var(--accent-subtle); margin-bottom: 16px;">
                    <h3 style="margin-top:0; font-size:1rem; font-weight:700; color:var(--primary);">Create Note</h3>
                    
                    <label class="field-label">Title *</label>
                    <input type="text" id="note-title" placeholder="Note Title...">

                    <label class="field-label">Category / Tag</label>
                    <input type="text" id="note-category" placeholder="Ideas, General, Reference...">

                    <label class="field-label">Content</label>
                    <textarea id="note-content" placeholder="Type your note content here..."></textarea>

                    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:10px;">
                        <button class="btn btn-success btn-small" onclick="saveNewNote()">Save Note</button>
                        <button class="btn btn-secondary btn-small" onclick="cancelAddNote()">Cancel</button>
                    </div>
                </div>
            `;
        }

        if (db.notes.length === 0 && !isAddingNote) {
            html += `<p style="color:var(--text-muted); text-align:center; padding: 28px;">No notes created. Tap "+ New Note" to write one.</p>`;
        } else {
            db.notes.forEach(n => {
                html += `
                    <div class="card interactive" onclick="navigate('note-detail', '${n.id}')">
                        <div class="flex-between" style="margin-bottom:8px;">
                            <strong style="font-size:1.02rem; color:var(--primary-light);">${n.title}</strong>
                            <span class="badge badge-cat">${n.category || 'General'}</span>
                        </div>
                        <div style="font-size:0.86rem; color:var(--text-muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.4;">
                            ${n.content || 'Empty note...'}
                        </div>
                    </div>
                `;
            });
        }

        container.innerHTML = html;
    }

    function showAddNoteForm() { isAddingNote = true; renderNotesView(document.getElementById('app-content')); }
    function cancelAddNote() { isAddingNote = false; renderNotesView(document.getElementById('app-content')); }

    function saveNewNote() {
        const title = document.getElementById('note-title').value.trim();
        if (!title) return alert("Please enter a Note Title");

        const category = document.getElementById('note-category').value.trim() || 'General';
        const content = document.getElementById('note-content').value;

        db.notes.push({
            id: 'n_' + Date.now(),
            title: title,
            category: category,
            content: content,
            updatedAt: new Date().toISOString()
        });

        isAddingNote = false;
        autoSave();
        renderNotesView(document.getElementById('app-content'));
    }

    function renderNoteDetailView(container, noteId) {
        const n = db.notes.find(x => x.id === noteId);
        if (!n) return navigate('notes');

        container.innerHTML = `
            <div class="flex-between" style="margin-bottom:14px;">
                <button class="btn btn-secondary btn-small" onclick="navigate('notes')">&larr; Back to Notes</button>
                <button class="btn btn-danger btn-small" onclick="deleteNote('${n.id}')">Delete Note</button>
            </div>

            <div class="card">
                <h3 style="margin-top:0; font-size:1.05rem; color:var(--primary); font-weight:700;">Edit Note</h3>
                
                <label class="field-label">Title</label>
                <input type="text" value="${n.title}" onchange="updateNoteField('${noteId}', 'title', this.value)">

                <label class="field-label">Category</label>
                <input type="text" value="${n.category || ''}" placeholder="Category" onchange="updateNoteField('${noteId}', 'category', this.value)">

                <label class="field-label">Content (Auto-saves):</label>
                <textarea placeholder="Write content..." oninput="updateNoteField('${noteId}', 'content', this.value)">${n.content || ''}</textarea>
            </div>
        `;
    }

    function updateNoteField(noteId, field, val) {
        const n = db.notes.find(x => x.id === noteId);
        if (n) {
            n[field] = val;
            n.updatedAt = new Date().toISOString();
            autoSave();
        }
    }

    function deleteNote(id) {
        if (confirm("Are you sure you want to delete this note?")) {
            db.notes = db.notes.filter(n => n.id !== id);
            autoSave();
            navigate('notes');
        }
    }

    // --- TAB 5: CALENDAR VIEW ---
    function prevMonth() { currentCalDate.setMonth(currentCalDate.getMonth() - 1); navigate('calendar'); }
    function nextMonth() { currentCalDate.setMonth(currentCalDate.getMonth() + 1); navigate('calendar'); }
    function todayMonth() { 
        currentCalDate = new Date(); 
        selectedCalDateKey = getTodayKey();
        navigate('calendar'); 
    }

    function selectCalDate(dateKey) {
        selectedCalDateKey = dateKey;
        renderCalendarView(document.getElementById('app-content'));
    }

    function renderCalendarView(container) {
        const year = currentCalDate.getFullYear();
        const month = currentCalDate.getMonth();
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        let itemsByDate = {};

        db.reminders.forEach(r => {
            if (!r.dueDate) return;
            const dateKey = r.dueDate.split('T')[0];
            if (!itemsByDate[dateKey]) itemsByDate[dateKey] = [];
            itemsByDate[dateKey].push({ type: 'reminder', ...r });
        });

        db.aims.forEach(a => {
            Object.keys(a.history || {}).forEach(dateKey => {
                if (a.history[dateKey]) {
                    if (!itemsByDate[dateKey]) itemsByDate[dateKey] = [];
                    itemsByDate[dateKey].push({ type: 'aim', title: a.title, status: 'done' });
                }
            });
        });

        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();
        const prevMonthTotalDays = new Date(year, month, 0).getDate();
        const todayStr = getTodayKey();

        let html = `
            <div class="cal-header">
                <div>
                    <button class="btn btn-secondary btn-small" onclick="prevMonth()">&lt;</button>
                    <button class="btn btn-secondary btn-small" onclick="nextMonth()">&gt;</button>
                    <button class="btn btn-primary btn-small" onclick="todayMonth()">Today</button>
                </div>
                <h2 style="margin:0; font-size:1.02rem; text-align:center; color:var(--primary); font-weight:700;">${monthNames[month]} ${year}</h2>
            </div>
            
            <div class="cal-grid-wrapper">
                <div class="cal-grid-header">
                    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                </div>
                <div class="cal-grid-body">
        `;

        for (let i = firstDayIndex - 1; i >= 0; i--) {
            html += `<div class="cal-day other-month"><div class="day-number">${prevMonthTotalDays - i}</div></div>`;
        }

        for (let day = 1; day <= totalDays; day++) {
            const monthStr = String(month + 1).padStart(2, '0');
            const dayStr = String(day).padStart(2, '0');
            const dateKey = `${year}-${monthStr}-${dayStr}`;
            const isToday = dateKey === todayStr;
            const isSelected = dateKey === selectedCalDateKey;
            const dayItems = itemsByDate[dateKey] || [];

            html += `
                <div class="cal-day ${isToday ? 'today' : ''} ${isSelected ? 'selected-day' : ''}" onclick="selectCalDate('${dateKey}')">
                    <div class="day-number">${day}</div>
                    <div class="day-events-dots">
                        ${dayItems.map(item => `<div class="dot ${item.status === 'done' ? 'done' : ''}"></div>`).join('')}
                    </div>
                </div>
            `;
        }

        const totalCellsSoFar = firstDayIndex + totalDays;
        const trailingCells = (7 - (totalCellsSoFar % 7)) % 7;
        for (let i = 1; i <= trailingCells; i++) {
            html += `<div class="cal-day other-month"><div class="day-number">${i}</div></div>`;
        }

        html += `</div></div>`;

        const selectedItems = itemsByDate[selectedCalDateKey] || [];

        html += `
            <div class="card" style="margin-top: 10px;">
                <h3 style="margin-top:0; font-size:0.98rem; font-weight:700; color:var(--primary);">
                    Schedule for ${formatHeaderDateStr(selectedCalDateKey)}
                </h3>
        `;

        if (selectedItems.length === 0) {
            html += `<p style="color:var(--text-muted); font-size:0.85rem; margin:0;">No activity or reminders for this day.</p>`;
        } else {
            selectedItems.forEach(item => {
                html += `
                    <div class="reminder-item ${item.status === 'done' ? 'done' : ''}" style="margin-bottom:8px;">
                        <div style="display:flex; align-items:center; flex:1;">
                            <div class="checkbox-btn ${item.status === 'done' ? 'checked' : ''}">${item.status === 'done' ? '✓' : ''}</div>
                            <div style="flex:1;">
                                <div class="reminder-title" style="font-weight:700; font-size:0.92rem;">${item.title}</div>
                                <div style="font-size:0.78rem; color:var(--text-muted);">${item.type === 'aim' ? 'Daily Aim Completed' : (formatTimeOnly(item.dueDate) || 'Reminder')}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        html += `</div>`;
        container.innerHTML = html;
    }

    // Boot App
    loadFromPrivateRepo();
</script>

</body>
</html>
